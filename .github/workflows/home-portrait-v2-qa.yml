name: Home Portrait v2 Technical QA

on:
  pull_request:
    paths:
      - 'docs/shiori/home-portrait-standard-v2.json'
      - 'docs/shiori/home-portrait-v2-generation-rules.md'
      - 'scripts/check_home_portrait_v2.py'
      - 'tests/test_check_home_portrait_v2.py'
      - 'public/assets/shiori/**'
  workflow_dispatch:

jobs:
  technical-portrait-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Run synthetic structural tests (not visual approval)
        run: python -m unittest discover -s tests -p 'test_check_home_portrait_v2.py' -v
      - name: Verify explicitly marked new v2 home images (technical only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # '-home-v2-' marks PORTRAIT standard v2, not the outfit folder /v2/.
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-v2.txt
          checked=0
          while IFS= read -r file; do
            case "$file" in
              public/assets/shiori/*-home-v2-*.webp|public/assets/shiori/*-home-v2-*.png)
                test -f "$file" || continue
                echo "Structural validation: $file"
                python scripts/check_home_portrait_v2.py "$file"
                checked=$((checked + 1))
                ;;
            esac
          done < /tmp/changed-v2.txt
          echo "v2 technical image checks executed: $checked"
          echo "This job never judges eye/chin location, facial expression, likeness or pose."
          echo "Human review against the private five and Android preview remain separate."
