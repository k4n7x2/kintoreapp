name: Home Portrait v2 Trial QA

on:
  pull_request:
    paths:
      - 'docs/shiori/home-portrait-standard-v2.json'
      - 'scripts/check_home_portrait_v2.py'
      - 'tests/test_check_home_portrait_v2.py'
      - 'public/assets/shiori/**'
  workflow_dispatch:

jobs:
  check-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependency
        run: python -m pip install Pillow numpy
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -p 'test_check_home_portrait_v2.py' -v
      - name: Read-only existing 10-image portrait comparison
        run: python scripts/audit_existing_home_v2.py
      - name: Check newly added/changed v2-marked home portraits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Outfit folder /v2/ is NOT a portrait-standard marker.
          # Only explicit -home-v2- files opt into the v2 registration gate.
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-v2.txt
          checked=0
          while IFS= read -r file; do
            case "$file" in
              public/assets/shiori/*-home-v2-*.webp|public/assets/shiori/*-home-v2-*.png)
                test -f "$file" || continue
                test -f "$file.anchors.json" || {
                  echo "::error file=$file::missing reviewed .anchors.json sidecar"
                  exit 1
                }
                echo "Checking $file"
                python scripts/check_home_portrait_v2.py "$file"
                checked=$((checked + 1))
                ;;
              public/assets/shiori/*-home-v2-*.anchors.json)
                image="${file%.anchors.json}"
                if test -f "$image"; then
                  echo "Checking changed sidecar for $image"
                  python scripts/check_home_portrait_v2.py "$image"
                  checked=$((checked + 1))
                fi
                ;;
            esac
          done < /tmp/changed-v2.txt
          echo "v2 annotated image checks executed: $checked"
          echo "NOTE: face identity, hairstyle, clothing and natural crops require human review."
