name: Validate Shiori portrait assets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-integrity:
    name: Portrait integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'Pillow>=11,<13'
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify every registered asset (no diff-based skips)
        run: python -m scripts.check_home_registry
      - name: Report coordinate calibration state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          data = json.loads(Path("docs/shiori/home-portrait-standard-v1.json").read_text())
          if data.get("status") == "calibrated":
              sys.exit(subprocess.call([sys.executable, "scripts/verify_home_calibration.py"]))
          print("Portrait landmark calibration is provisional; new images fail the registration gate.")
          PY
